[project]
name = "pytorch-for-deep-learning"
version = "0.1.0"
description = "Follow-along PyTorch exercises for DeepLearning.AI's PyTorch for Deep Learning certificate."
readme = "README.md"
authors = [
    { name = "Gilles Major", email = "major.gilles@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "directory-tree>=1.0.0",
    "dlai-grader>=2.3.0",
    "fastai>=2.8.12",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "requests>=2.34.2",
    "ruff>=0.16.6",
    "scikit-learn>=1.9.0",
    "scipy-stubs~=1.18.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
